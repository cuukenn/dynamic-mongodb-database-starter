# 相当于脚本用途的一个声明
name: Maven Central Repo Deployment
# 触发脚本的事件  这里为发布release之后触发
on:
  release:
    types: [ released ]
# 只读取仓库内容，凭据全部来自 secrets
permissions:
  contents: read
# 定义一个发行任务
jobs:
  publish:
    # 任务运行的环境
    runs-on: ubuntu-latest
    # 任务的步骤
    steps:
      # 1. 声明 checkout 仓库代码到工作区
      - name: Checkout Git Repo
        uses: actions/checkout@v4
      # 2. 安装 Java 环境
      #    注意：setup-java 的 server-username / server-password / gpg-passphrase 收的是「环境变量名」而不是值，
      #    它把名字写进 settings.xml 的 ${env.XXX} 占位符，真正的值在第 3 步用同名环境变量注入。
      #    server-id 必须等于 pom 中 central-publishing-maven-plugin 的 publishingServerId（central）。
      - name: Setup JDK
        id: setup_jdk
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'
          cache: maven
          server-id: central
          server-username: OSSRH_USERNAME
          server-password: OSSRH_TOKEN
          gpg-private-key: ${{ secrets.OSSRH_GPG_SECRET_KEY }}
          gpg-passphrase: OSSRH_GPG_SECRET_KEY_PASSWORD
      # 3. 发布到 Maven 中央仓库（Central Portal）
      #    pom 里 autoPublish=false：上传后产物会停在 Central Portal，需要人工点一次 Publish 才公开。
      - name: Publish to Maven Central Repo
        env:
          OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          OSSRH_TOKEN: ${{ secrets.OSSRH_TOKEN }}
          OSSRH_GPG_SECRET_KEY_PASSWORD: ${{ secrets.OSSRH_GPG_SECRET_KEY_PASSWORD }}
        run: mvn -B -P release deploy
