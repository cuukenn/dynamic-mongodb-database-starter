name: Build

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'
          cache: maven

      # src/test 是纯单元测试，不需要 Mongo 实例
      - name: Build and Test
        run: mvn -B verify

      # 发布相关改动后跑一次：确认 release profile 的插件与配置能解析（不发布、不签名）
      - name: Validate release profile
        run: mvn -B -P release validate
